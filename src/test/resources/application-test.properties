# Perfil de pruebas: H2 en memoria, sin depender de una MariaDB local.
# Los recursos de src/test/resources pisan a los de src/main/resources, asi que
# el perfil activo durante los tests es 'test' y este datasource gana sobre el
# application-dev.properties de dev.
spring.datasource.url=jdbc:h2:mem:paymentsdb;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
server.port=0
