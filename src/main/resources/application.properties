spring.application.name=payments-service

# Perfil activo por defecto (se define en .env como SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8086}

# RabbitMQ: payments publica order.paid en el exchange pcmarketbuilder.direct (lo consume reports-service).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pcmarket}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pcmarket}
# Publisher confirms: el broker avisa si rechaza un mensaje o no hay cola destino (se registra en el log).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
