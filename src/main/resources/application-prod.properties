spring.application.name=payments-service

# Puerto: SERVER_PORT lo inyecta el orquestador / .env. El default 8086 evita
# que un valor vacío lo siente en un puerto aleatorio (o en 8080).
server.port=${SERVER_PORT:8086}

# MariaDB del perfil prod (misma EC2 o RDS, dentro de la VPC).
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&sslMode=trust
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.show-sql=false

# El contenedor expone el servicio en todas las interfaces para que lo alcance
# el proxy inverso / el BFF dentro de la VPC.
server.address=0.0.0.0
