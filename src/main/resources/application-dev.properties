spring.application.name=payments-service

# MariaDB local para desarrollo.
# Ajustar usuario/password si la instancia local no acepta root sin clave.
spring.datasource.url=jdbc:mariadb://localhost:3306/db_payments?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ddl-auto va bajo spring.jpa.hibernate; bajo spring.jpa.properties no lo lee
# Hibernate (se ignoraba en silencio). update crea/migra las tablas en dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# server.port se hereda de application.properties (${SERVER_PORT:8086}) para que
# la variable de entorno también aplique en dev.

# Para que la salida de la consola sea más legible
spring.output.ansi.enabled=always
